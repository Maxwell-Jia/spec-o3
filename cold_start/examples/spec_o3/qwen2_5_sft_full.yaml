### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
# add_tokens: <think>,</think>,<answer>,</answer>,<tool_response>,</tool_response>

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: merged_train_sharegpt
dataset_dir: data/merged_train_sharegpt
template: qwen2_vl
cutoff_len: 32768
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: checkpoints/qwen2_5vl-7b/merged
logging_steps: 1
save_steps: 6
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]
log_level: info
logging_strategy: steps
logging_first_step: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
